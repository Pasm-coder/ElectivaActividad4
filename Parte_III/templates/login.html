<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SECURELINK - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🔐
            </div>

            <h1>SECURELINK</h1>

            <p class="subtitle">
                Sistema seguro de autenticación
            </p>

            {% if mensaje %}

                <div class="error">
                    {{ mensaje }}
                </div>

            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingrese su usuario"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

                <p>
                    ¿No tienes una cuenta?
                    <a href="{{ url_for('registro') }}">
                        Crear usuario
                    </a>
                </p>

            </form>

            <div class="security-info">

                <p>
                    🔒 Contraseñas protegidas con bcrypt
                </p>

                <p>
                    🛡️ Acceso controlado mediante roles
                </p>

            </div>

        </div>

    </div>

</body>

</html>

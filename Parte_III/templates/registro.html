<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear usuario - SECURELINK</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="login-container">

        <h1>Crear usuario</h1>

        <p>Registra una nueva cuenta en SECURELINK.</p>

        {% if mensaje %}
            <p class="mensaje">{{ mensaje }}</p>
        {% endif %}

        <form method="POST">

            <label for="usuario">
                Nombre de usuario
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <p>
            ¿Ya tienes una cuenta?
            <a href="{{ url_for('login') }}">
                Iniciar sesión
            </a>
        </p>

    </div>

</body>

</html>
